/* Ghidra Local LLM RE Assistant - extension build.
 *
 * Usage:
 *   export GHIDRA_INSTALL_DIR=/path/to/ghidra_12.0.1_PUBLIC
 *   ./gradlew test buildExtension        # (or `gradle ...`)
 *
 * The extension ZIP is written to dist/.
 */

//----------------------START "DO NOT MODIFY" SECTION------------------------------
def ghidraInstallDir

if (System.env.GHIDRA_INSTALL_DIR) {
	ghidraInstallDir = System.env.GHIDRA_INSTALL_DIR
}
else if (project.hasProperty("GHIDRA_INSTALL_DIR")) {
	ghidraInstallDir = project.getProperty("GHIDRA_INSTALL_DIR")
}

if (ghidraInstallDir) {
	// Tolerate quotes/whitespace/angle brackets pasted into the value, then validate it.
	ghidraInstallDir = ghidraInstallDir.toString().trim().replaceAll('^["\'<]+|["\'>]+$', '').trim()
	def installDir = new File(ghidraInstallDir)
	def buildScript = new File(installDir, "support/buildExtension.gradle")
	if (!installDir.isDirectory() || !buildScript.isFile()) {
		throw new GradleException("""GHIDRA_INSTALL_DIR does not point at a Ghidra installation.
  value received : [${ghidraInstallDir}]
  expected       : a folder that contains support/buildExtension.gradle (the folder with ghidraRun / ghidraRun.bat)
  Tips: use the real path of your unzipped Ghidra (not the example text); no quotes needed inside the value; avoid '<' '>'.""")
	}
	apply from: buildScript.getCanonicalPath()
}
else {
	throw new GradleException("""GHIDRA_INSTALL_DIR is not defined. Point it at your Ghidra folder (the one containing ghidraRun and support/), using any ONE of:
  PowerShell : \$env:GHIDRA_INSTALL_DIR = "C:\\path\\to\\ghidra_12.0.1_PUBLIC"
  cmd        : set GHIDRA_INSTALL_DIR=C:\\path\\to\\ghidra_12.0.1_PUBLIC     (no quotes)
  Linux/macOS: export GHIDRA_INSTALL_DIR=/path/to/ghidra_12.0.1_PUBLIC
  one-off    : gradlew buildExtension -PGHIDRA_INSTALL_DIR=<path>
  permanent  : add GHIDRA_INSTALL_DIR=<path with forward slashes> to <your user home>/.gradle/gradle.properties""")
}
//----------------------END "DO NOT MODIFY" SECTION-------------------------------

repositories {
	mavenCentral()
}

dependencies {
	// Bundled into the extension's lib/ directory by Ghidra's copyDependencies task.
	// (Gson and the Ghidra APIs are provided by Ghidra itself.)
	implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
}

test {
	useJUnitPlatform()
	// Integration tests boot a headless Ghidra application from this directory.
	systemProperty 'ghidra.install.dir', ghidraInstallDir
	jvmArgs '-Djava.awt.headless=true', '-Xmx1g'
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

// Developer preview: renders the real panel against a mock LM Studio (needs a display, e.g. xvfb-run).
tasks.register('previewPanel', JavaExec) {
	group = 'verification'
	description = 'Renders UI screenshots to build/preview'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'ghidrallm.ui.PanelPreview'
	systemProperty 'ghidra.install.dir', ghidraInstallDir
	args 'build/preview'
}

buildExtension {
	exclude 'gradle.properties'
	exclude 'gradle/**'
	exclude 'docs/**'
	exclude 'examples/**'
	exclude 'tests/**'
}
